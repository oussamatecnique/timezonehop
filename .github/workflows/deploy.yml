name: Test, build and deploy

on:
  push:
    branches: [main]
  schedule:
    # Daily rebuild so daylight saving dates and conversion tables stay current.
    - cron: '5 0 * * *'
    # Hourly on weekends (UTC), when most clock changes happen (EU 01:00Z Sunday,
    # North America 06:00–09:00Z Sunday, Australia/NZ Saturday afternoon UTC), so pages
    # never describe a change that already happened for more than an hour.
    - cron: '35 * * * 6,0'
  workflow_dispatch:

permissions:
  contents: read
  actions: write # only for the keep-alive step below

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_ADSENSE_CLIENT: ${{ vars.PUBLIC_ADSENSE_CLIENT }}
      PUBLIC_ADS_ENABLED: ${{ vars.PUBLIC_ADS_ENABLED }}
      PUBLIC_AD_SLOT_BELOW_TOOL: ${{ vars.PUBLIC_AD_SLOT_BELOW_TOOL }}
      PUBLIC_AD_SLOT_IN_CONTENT: ${{ vars.PUBLIC_AD_SLOT_IN_CONTENT }}
      PUBLIC_AD_SLOT_SIDEBAR: ${{ vars.PUBLIC_AD_SLOT_SIDEBAR }}
      PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:dist
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # GitHub pauses scheduled workflows in public repos after 60 days without commits;
      # re-enabling the workflow through the API keeps the nightly rebuilds running.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
